<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusMarket | Catalog & Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <div class="logo">CampusMarket</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html" class="active">Catalog</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="catalog-header">
      <h1>Campus Marketplace Listings</h1>
      <p>Find affordable essentials listed by verified campus students.</p>

      <!-- Filter Controls -->
      <div class="filter-container">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search items..." 
          aria-label="Search items"
        >
        <select id="category-select" aria-label="Select category">
          <option value="all">All Categories</option>
          <option value="books">Textbooks</option>
          <option value="electronics">Electronics</option>
          <option value="housing">Dorm Gear & Furniture</option>
        </select>
      </div>
    </section>

    <!-- Part 1 Integration: Interactive Dynamic Product Gallery -->
    <section class="gallery-section">
      <h2>Featured Filtered Items Showcase</h2>
      <div class="slideshow-container">
        <button id="prev-slide-btn" class="slideshow-btn" aria-label="Previous Slide">&lt;</button>
        
        <div class="slide-wrapper">
          <img id="gallery-image" src="" alt="CampusMarket featured product preview image">
          <div class="slide-caption">
            <h3 id="gallery-title">Product Title</h3>
            <p id="gallery-price" class="price">$0.00</p>
          </div>
        </div>

        <button id="next-slide-btn" class="slideshow-btn" aria-label="Next Slide">&gt;</button>
      </div>
      <p id="gallery-status" class="gallery-status-text">Showing item 0 of 0</p>
    </section>

    <!-- Product Grid Section (Dynamically populated via fetch in Assignment 5) -->
    <section class="catalog-grid" id="product-grid">
      <!-- Product cards will be injected here automatically by app.js -->
    </section>
  </main>

  <!-- Shared Footer -->
  <footer>
    <p>&copy; 2026 CampusMarket. Built for students, by students.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
